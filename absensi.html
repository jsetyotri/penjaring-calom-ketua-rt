<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Hadir Pencoblosan RT 29</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, sans-serif;
      background: #f0fdf4;
      color: #1e293b;
      padding: 12px;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .container { max-width: 540px; margin: 0 auto; width: 100%; }

    .header {
      background: linear-gradient(135deg, #166534, #22c55e);
      color: white;
      padding: 24px 20px;
      border-radius: 16px;
      margin-bottom: 12px;
      text-align: center;
    }

    .header h1 { font-size: 1.25rem; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
    .header p { font-size: 0.85rem; opacity: 0.9; }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      background: white;
      padding: 14px 8px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }

    .stat-num {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-num.green { color: #16a34a; }
    .stat-num.red { color: #dc2626; }
    .stat-num.blue { color: #1e40af; }

    .stat-label {
      font-size: 0.7rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
    }

    .persen-bar {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }

    .persen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .persen-header span { font-size: 0.85rem; font-weight: 600; color: #334155; }

    .persen-header strong {
      font-size: 1.3rem;
      font-weight: 800;
      color: #16a34a;
    }

    .bar-track {
      height: 12px;
      background: #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      border-radius: 12px;
      transition: width 0.5s ease;
      min-width: 2px;
    }

    /* ── Search & filter ── */
    .controls {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }

    .search-box {
      display: block;
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      background: #f8fafc;
      transition: border-color 0.2s;
    }

    .search-box:focus { border-color: #22c55e; background: white; }

    .filters {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .filter-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: white;
      color: #64748b;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .filter-btn.active {
      border-color: #22c55e;
      background: #f0fdf4;
      color: #16a34a;
    }

    /* ── Blok summary chips ── */
    .blok-summary {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }

    .blok-summary h2 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #334155;
    }

    .blok-chip-grid { display: flex; flex-wrap: wrap; gap: 6px; }

    .blok-chip {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .blok-chip.ok { background: #dcfce7; color: #16a34a; }
    .blok-chip.warn { background: #fef9c3; color: #a16207; }
    .blok-chip.bad { background: #fee2e2; color: #dc2626; }

    /* ── Blok section ── */
    .blok-section {
      background: white;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .blok-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #f8fafc;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      user-select: none;
    }

    .blok-header:active { background: #f1f5f9; }
    .blok-title { font-size: 0.9rem; font-weight: 700; color: #334155; }

    .blok-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .blok-badge.complete { background: #dcfce7; color: #16a34a; }
    .blok-badge.partial { background: #fef9c3; color: #a16207; }
    .blok-badge.empty { background: #fee2e2; color: #dc2626; }

    .blok-body { display: none; }
    .blok-body.open { display: block; }

    /* ── Warga row ── */
    .warga-row {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #f8fafc;
      gap: 10px;
      transition: background 0.15s;
    }

    .warga-row:last-child { border-bottom: none; }
    .warga-row.hadir { background: #f0fdf4; }

    .warga-info { flex: 1; min-width: 0; }
    .warga-blok { font-size: 0.9rem; font-weight: 700; color: #1e293b; }

    .warga-nama {
      font-size: 0.8rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .warga-time { font-size: 0.7rem; color: #16a34a; margin-top: 2px; }

    .btn-hadir {
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .btn-hadir.mark { background: #22c55e; color: white; }
    .btn-hadir.mark:active { background: #16a34a; transform: scale(0.96); }
    .btn-hadir.undo { background: #fee2e2; color: #dc2626; font-weight: 600; }
    .btn-hadir.undo:active { background: #fecaca; }
    .btn-hadir:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer {
      text-align: center;
      padding: 12px;
      font-size: 0.7rem;
      color: #94a3b8;
    }

    .loading { text-align: center; padding: 40px; color: #94a3b8; }

    .refresh-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      color: #166534;
      background: #dcfce7;
      border: 2px solid #bbf7d0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .refresh-btn:active { background: #bbf7d0; transform: scale(0.96); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Daftar Hadir Pencoblosan</h1>
      <p>RT 29 &mdash; Petugas input kehadiran warga</p>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-num blue" id="sTotal">—</div>
        <div class="stat-label">Total KK</div>
      </div>
      <div class="stat">
        <div class="stat-num green" id="sHadir">—</div>
        <div class="stat-label">Hadir</div>
      </div>
      <div class="stat">
        <div class="stat-num red" id="sBelum">—</div>
        <div class="stat-label">Belum</div>
      </div>
    </div>

    <div class="persen-bar">
      <div class="persen-header">
        <span>Kehadiran</span>
        <strong id="sPersen">0%</strong>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="sBar" style="width:0%"></div>
      </div>
    </div>

    <!-- Blok overview -->
    <div class="blok-summary">
      <h2>Status Per Blok</h2>
      <div class="blok-chip-grid" id="blokChips"></div>
    </div>

    <!-- Tambah Warga -->
    <div class="controls" id="addWargaPanel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <span style="font-size:0.9rem;font-weight:700;color:#334155;">➕ Tambah Warga Baru</span>
        <button onclick="toggleAddForm()" id="toggleAddBtn"
          style="font-size:0.8rem;font-family:inherit;padding:5px 12px;border:2px solid #e2e8f0;border-radius:8px;background:white;color:#64748b;cursor:pointer;font-weight:600;">
          Buka
        </button>
      </div>
      <div id="addFormBody" style="display:none;">
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <input type="text" id="addNama" class="search-box" placeholder="Nama warga" style="flex:1;">
          <input type="text" id="addBlok" class="search-box" placeholder="Blok (mis: F4-20)" style="flex:0 0 120px;">
        </div>
        <button onclick="submitAddWarga()" id="btnAddWarga"
          style="width:100%;padding:10px;font-size:0.85rem;font-weight:700;font-family:inherit;border:none;border-radius:8px;background:#166534;color:white;cursor:pointer;transition:all 0.15s;">
          Tambah
        </button>
        <div id="addMsg" style="display:none;margin-top:8px;padding:10px 12px;border-radius:8px;font-size:0.85rem;"></div>
      </div>
    </div>

    <!-- Search & Filter -->
    <div class="controls">
      <input type="text" class="search-box" id="searchBox"
        placeholder="Cari blok atau nama..." autocomplete="off">
      <div class="filters">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Semua</button>
        <button class="filter-btn" data-filter="belum" onclick="setFilter('belum')">Belum Hadir</button>
        <button class="filter-btn" data-filter="hadir" onclick="setFilter('hadir')">Sudah Hadir</button>
      </div>
    </div>

    <!-- Warga list -->
    <div id="wargaList">
      <div class="loading">Memuat data warga...</div>
    </div>

    <div class="footer">
      <div id="updatedAt"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap;">
        <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
        <button class="refresh-btn" onclick="downloadLaporan()" style="color:#1e40af;background:#dbeafe;border-color:#bfdbfe;">📥 CSV</button>
        <button class="refresh-btn" onclick="downloadPDF()" style="color:#7c2d12;background:#fff7ed;border-color:#fed7aa;">📄 PDF</button>
      </div>
    </div>
  </div>

  <script>
    // ▼▼▼ GANTI URL INI dengan URL deployment Apps Script ▼▼▼
    var API_URL = 'https://script.google.com/macros/s/AKfycbzzOc0CGJJR3qtVGpJ7ir2RxGa9p66rF8jeOoUuqwCnhIZmqdw3nABHPL9GROTPRmbPFg/exec';
    // ▲▲▲ GANTI URL DI ATAS ▲▲▲

    var allWarga = [];
    var currentFilter = 'all';
    var currentSearch = '';
    var openBloks = {};  // ingat blok mana yang sedang dibuka

    function api(action, params) {
      var url = API_URL + '?action=' + action;
      if (params) {
        for (var k in params) url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      }
      return fetch(url).then(function(r) { return r.json(); });
    }

    // ── Load data ──
    function loadData() {
      api('absen_data')
        .then(function(res) {
          if (!res.success) return;
          allWarga = res.data.warga || [];
          renderStats(res.data.stats);
          renderBlokChips(res.data.stats.blok || {});
          renderList();
        })
        .catch(function() {
          document.getElementById('wargaList').innerHTML =
            '<div class="loading" style="color:#dc2626">Gagal memuat data. Coba refresh.</div>';
        });
    }

    // ── Render stats ──
    function renderStats(s) {
      document.getElementById('sTotal').textContent = s.total;
      document.getElementById('sHadir').textContent = s.hadir;
      document.getElementById('sBelum').textContent = s.belum;
      document.getElementById('sPersen').textContent = s.persen + '%';
      document.getElementById('sBar').style.width = Math.max(s.persen, 1) + '%';
      document.getElementById('updatedAt').textContent = 'Diperbarui: ' + s.updatedAt;
    }

    // ── Render blok chips ──
    function renderBlokChips(blokData) {
      var container = document.getElementById('blokChips');
      container.innerHTML = '';

      var bloks = Object.keys(blokData).sort(function(a, b) {
        return a.localeCompare(b, undefined, { numeric: true });
      });

      bloks.forEach(function(blok) {
        var d = blokData[blok];
        var pct = Math.round(d.hadir / d.total * 100);
        var cls = pct === 100 ? 'ok' : (pct >= 50 ? 'warn' : 'bad');

        var chip = document.createElement('span');
        chip.className = 'blok-chip ' + cls;
        chip.textContent = blok + ' ' + d.hadir + '/' + d.total;
        container.appendChild(chip);
      });
    }

    // ── Render warga list ──
    function renderList() {
      var container = document.getElementById('wargaList');
      container.innerHTML = '';

      var groups = {};
      var search = currentSearch.toLowerCase();

      allWarga.forEach(function(w) {
        if (currentFilter === 'hadir' && !w.hadir) return;
        if (currentFilter === 'belum' && w.hadir) return;

        if (search) {
          var haystack = (w.blok + ' ' + w.nama).toLowerCase();
          if (haystack.indexOf(search) < 0) return;
        }

        var prefix = getBlokPrefix(w.blok);
        if (!groups[prefix]) groups[prefix] = [];
        groups[prefix].push(w);
      });

      var keys = Object.keys(groups).sort(function(a, b) {
        return a.localeCompare(b, undefined, { numeric: true });
      });

      if (keys.length === 0) {
        container.innerHTML = '<div class="loading">Tidak ada data ditemukan.</div>';
        return;
      }

      keys.forEach(function(prefix) {
        var section = document.createElement('div');
        section.className = 'blok-section';

        var list = groups[prefix];
        var hadirCount = list.filter(function(w) { return w.hadir; }).length;
        var badgeClass = hadirCount === list.length ? 'complete'
          : (hadirCount > 0 ? 'partial' : 'empty');

        var header = document.createElement('div');
        header.className = 'blok-header';
        header.innerHTML =
          '<span class="blok-title">Blok ' + esc(prefix) + '</span>' +
          '<span class="blok-badge ' + badgeClass + '">' +
          hadirCount + ' / ' + list.length + '</span>';

        var body = document.createElement('div');
        body.className = 'blok-body';

        // Buka kalau sedang search/filter, atau kalau sebelumnya sudah dibuka
        if (search || currentFilter !== 'all' || openBloks[prefix]) {
          body.classList.add('open');
        }

        header.onclick = (function(p, b) {
          return function() {
            b.classList.toggle('open');
            openBloks[p] = b.classList.contains('open');
          };
        })(prefix, body);

        list.forEach(function(w) {
          var row = document.createElement('div');
          row.className = 'warga-row' + (w.hadir ? ' hadir' : '');

          var info = document.createElement('div');
          info.className = 'warga-info';
          info.innerHTML =
            '<div class="warga-blok">' + esc(w.blok) + '</div>' +
            (w.nama ? '<div class="warga-nama">' + esc(w.nama) + '</div>' : '') +
            (w.hadir && w.timestamp
              ? '<div class="warga-time">Hadir ' + esc(w.timestamp) + '</div>'
              : '');

          var btn = document.createElement('button');
          btn.className = 'btn-hadir ' + (w.hadir ? 'undo' : 'mark');
          btn.textContent = w.hadir ? 'Batal' : 'Hadir';
          btn.onclick = function() { toggleAbsen(w.blok, w.hadir, btn); };

          row.appendChild(info);
          row.appendChild(btn);
          body.appendChild(row);
        });

        section.appendChild(header);
        section.appendChild(body);
        container.appendChild(section);
      });
    }

    // ── Toggle absensi ──
    function toggleAbsen(blok, isHadir, btn) {
      btn.disabled = true;
      btn.textContent = '...';

      // Optimistic update: langsung ubah tampilan row
      var row = btn.parentElement;
      if (!isHadir) {
        row.classList.add('hadir');
        btn.className = 'btn-hadir undo';
        btn.textContent = 'Batal';
      } else {
        row.classList.remove('hadir');
        btn.className = 'btn-hadir mark';
        btn.textContent = 'Hadir';
      }
      btn.disabled = false;

      var action = isHadir ? 'absen_undo' : 'absen_checkin';

      api(action, { blok: blok })
        .then(function(res) {
          if (!res.success) {
            alert(res.message);
            // Rollback
            if (!isHadir) {
              row.classList.remove('hadir');
              btn.className = 'btn-hadir mark';
              btn.textContent = 'Hadir';
            } else {
              row.classList.add('hadir');
              btn.className = 'btn-hadir undo';
              btn.textContent = 'Batal';
            }
            return;
          }
          // Refresh data di background tanpa menutup blok
          loadData();
        })
        .catch(function() {
          alert('Gagal menghubungi server.');
          // Rollback
          if (!isHadir) {
            row.classList.remove('hadir');
            btn.className = 'btn-hadir mark';
            btn.textContent = 'Hadir';
          } else {
            row.classList.add('hadir');
            btn.className = 'btn-hadir undo';
            btn.textContent = 'Batal';
          }
        });
    }

    // ── Filter ──
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-filter') === filter);
      });
      renderList();
    }

    // ── Search ──
    document.getElementById('searchBox').addEventListener('input', function() {
      currentSearch = this.value.trim();
      renderList();
    });

    // ── Helpers ──
    function getBlokPrefix(blok) {
      var match = blok.match(/^([A-Za-z]+)-?(\d+)/);
      if (match) return (match[1] + match[2]).toUpperCase();
      return blok.trim().toUpperCase() || '?';
    }

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ── Manual refresh ──
    function refreshData() {
      var btn = document.querySelector('.refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Memuat...';
      loadData();
      setTimeout(function() {
        btn.disabled = false;
        btn.textContent = '🔄 Refresh Data';
      }, 1500);
    }

    // ── Download laporan CSV ──
    function downloadLaporan() {
      if (!allWarga.length) { alert('Data belum dimuat.'); return; }

      var totalKK = allWarga.length;
      var hadir = allWarga.filter(function(w) { return w.hadir; });
      var belum = allWarga.filter(function(w) { return !w.hadir; });
      var persen = Math.round(hadir.length / totalKK * 100);

      var lines = [];
      lines.push('LAPORAN DAFTAR HADIR PENCOBLOSAN RT 29');
      lines.push('Tanggal: ' + new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }));
      lines.push('');
      lines.push('RINGKASAN');
      lines.push('Total KK,' + totalKK);
      lines.push('Hadir,' + hadir.length);
      lines.push('Belum Hadir,' + belum.length);
      lines.push('Persentase Kehadiran,' + persen + '%');
      lines.push('');

      // Per blok
      var blokMap = {};
      allWarga.forEach(function(w) {
        var prefix = getBlokPrefix(w.blok);
        if (!blokMap[prefix]) blokMap[prefix] = { total: 0, hadir: 0 };
        blokMap[prefix].total++;
        if (w.hadir) blokMap[prefix].hadir++;
      });

      lines.push('STATUS PER BLOK');
      lines.push('Blok,Total,Hadir,Belum,Persen');
      Object.keys(blokMap).sort(function(a, b) {
        return a.localeCompare(b, undefined, { numeric: true });
      }).forEach(function(blok) {
        var d = blokMap[blok];
        var p = Math.round(d.hadir / d.total * 100);
        lines.push(blok + ',' + d.total + ',' + d.hadir + ',' + (d.total - d.hadir) + ',' + p + '%');
      });

      lines.push('');
      lines.push('DAFTAR HADIR');
      lines.push('No,Blok,Nama,Status,Waktu Hadir');
      var no = 1;
      allWarga.forEach(function(w) {
        lines.push(no + ',' + w.blok + ',"' + w.nama + '",' +
          (w.hadir ? 'Hadir' : 'Belum') + ',' +
          (w.timestamp || '-'));
        no++;
      });

      lines.push('');
      lines.push('BELUM HADIR');
      lines.push('No,Blok,Nama');
      var nb = 1;
      belum.forEach(function(w) {
        lines.push(nb + ',' + w.blok + ',"' + w.nama + '"');
        nb++;
      });

      // BOM untuk Excel baca UTF-8
      var csv = '﻿' + lines.join('\n');
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);

      var a = document.createElement('a');
      a.href = url;
      a.download = 'Laporan_Absensi_RT29_' +
        new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    // ── Download PDF ──
    function downloadPDF() {
      if (!allWarga.length) { alert('Data belum dimuat.'); return; }

      var totalKK = allWarga.length;
      var hadirList = allWarga.filter(function(w) { return w.hadir; });
      var belumList = allWarga.filter(function(w) { return !w.hadir; });
      var persen = Math.round(hadirList.length / totalKK * 100);

      // Sort hadir berdasarkan waktu kedatangan
      hadirList.sort(function(a, b) {
        return (a.timestamp || '').localeCompare(b.timestamp || '');
      });

      var now = new Date();
      var tglFormal = now.toLocaleDateString('id-ID', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      var jamCetak = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

      var html = '<!DOCTYPE html><html><head><meta charset="utf-8">' +
        '<style>' +
        'body{font-family:"Times New Roman",Times,serif;color:#000;padding:30px 50px;font-size:12px;line-height:1.6;}' +
        '.kop{text-align:center;border-bottom:3px double #000;padding-bottom:12px;margin-bottom:20px;}' +
        '.kop h1{font-size:15px;font-weight:bold;margin:0;letter-spacing:1px;}' +
        '.kop h2{font-size:13px;font-weight:bold;margin:2px 0;}' +
        '.kop .alamat{font-size:10px;margin:2px 0;color:#333;}' +
        '.judul{text-align:center;margin:16px 0;font-size:16px;font-weight:bold;text-decoration:underline;letter-spacing:2px;}' +
        '.info-table{margin:0 0 16px;font-size:12px;}' +
        '.info-table td{padding:2px 0;vertical-align:top;}' +
        '.info-table td:first-child{width:120px;font-weight:bold;}' +
        '.info-table td:nth-child(2){width:14px;text-align:center;}' +
        'table.daftar{width:100%;border-collapse:collapse;margin:12px 0;}' +
        'table.daftar th,table.daftar td{border:1px solid #000;padding:6px 10px;font-size:11px;}' +
        'table.daftar th{background:#f0f0f0;font-weight:bold;text-align:center;}' +
        'table.daftar td.no{text-align:center;width:36px;}' +
        'table.daftar td.blok{text-align:center;width:80px;}' +
        'table.daftar td.waktu{text-align:center;width:90px;font-size:10px;color:#444;}' +
        '.ringkasan{margin:16px 0;padding:12px 16px;border:1px solid #000;font-size:12px;}' +
        '.ringkasan td{padding:3px 0;}' +
        '.ringkasan td:first-child{width:180px;}' +
        '.ringkasan td:nth-child(2){width:14px;text-align:center;}' +
        '.ringkasan td:last-child{font-weight:bold;}' +
        '.ttd-area{margin-top:40px;display:flex;justify-content:space-between;}' +
        '.ttd-box{text-align:center;width:200px;}' +
        '.ttd-box .line{margin-top:60px;border-top:1px solid #000;padding-top:4px;}' +
        '.footer-note{text-align:center;color:#999;font-size:9px;margin-top:30px;border-top:1px solid #ccc;padding-top:8px;}' +
        '@media print{body{padding:20px 40px;}@page{margin:15mm;size:A4;}}' +
        '</style></head><body>';

      // Kop surat
      html += '<div class="kop">';
      html += '<h1>PERMATA GREEN MENGANTI REGENCY</h1>';
      html += '<h2>RT. 29 RW. 10</h2>';
      html += '<div class="alamat">Desa Drancang - Kecamatan Menganti</div>';
      html += '<div class="alamat">Kabupaten Gresik - Jawa Timur</div>';
      html += '<div class="alamat">Kode Pos 61174</div>';
      html += '</div>';

      // Judul
      html += '<div class="judul">DAFTAR HADIR</div>';

      // Info acara
      html += '<table class="info-table">';
      html += '<tr><td>Hari / Tanggal</td><td>:</td><td>' + tglFormal + '</td></tr>';
      html += '<tr><td>Waktu</td><td>:</td><td>19:00 – selesai</td></tr>';
      html += '<tr><td>Agenda</td><td>:</td><td>Pemilihan Ketua RT 29 RW 10</td></tr>';
      html += '<tr><td>Tempat</td><td>:</td><td>Pos Tanah Lot</td></tr>';
      html += '</table>';

      // Tabel daftar hadir (urut waktu kedatangan)
      html += '<table class="daftar">';
      html += '<tr><th>No</th><th>Nama</th><th>Blok</th><th>Waktu Hadir</th></tr>';
      hadirList.forEach(function(w, i) {
        html += '<tr>';
        html += '<td class="no">' + (i + 1) + '</td>';
        html += '<td>' + esc(w.nama) + '</td>';
        html += '<td class="blok">' + esc(w.blok) + '</td>';
        html += '<td class="waktu">' + (w.timestamp || '-') + '</td>';
        html += '</tr>';
      });
      html += '</table>';

      // Ringkasan
      html += '<table class="ringkasan">';
      html += '<tr><td>Total Warga Terdaftar</td><td>:</td><td>' + totalKK + ' KK</td></tr>';
      html += '<tr><td>Hadir</td><td>:</td><td>' + hadirList.length + ' KK</td></tr>';
      html += '<tr><td>Tidak Hadir</td><td>:</td><td>' + belumList.length + ' KK</td></tr>';
      html += '<tr><td>Persentase Kehadiran</td><td>:</td><td>' + persen + '%</td></tr>';
      html += '</table>';

      // Area tanda tangan
      html += '<div class="ttd-area">';
      html += '<div class="ttd-box">Mengetahui,<div class="line">Ketua Panitia</div></div>';
      html += '<div class="ttd-box">Gresik, ' + now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) + '<div class="line">Petugas Absensi</div></div>';
      html += '</div>';

      html += '<div class="footer-note">Dicetak dari Sistem Absensi RT 29 &mdash; ' + tglFormal + ' pukul ' + jamCetak + '</div>';
      html += '</body></html>';

      var win = window.open('', '_blank');
      win.document.write(html);
      win.document.close();
      setTimeout(function() { win.print(); }, 500);
    }

    // ── Tambah Warga ──
    function toggleAddForm() {
      var body = document.getElementById('addFormBody');
      var btn = document.getElementById('toggleAddBtn');
      var isOpen = body.style.display !== 'none';
      body.style.display = isOpen ? 'none' : 'block';
      btn.textContent = isOpen ? 'Buka' : 'Tutup';
      btn.style.color = isOpen ? '#64748b' : '#dc2626';
      btn.style.borderColor = isOpen ? '#e2e8f0' : '#fecaca';
      if (!isOpen) document.getElementById('addNama').focus();
    }

    function submitAddWarga() {
      var nama = document.getElementById('addNama').value.trim();
      var blok = document.getElementById('addBlok').value.trim();
      var btn = document.getElementById('btnAddWarga');
      var msg = document.getElementById('addMsg');

      if (!nama) { showAddMsg(msg, 'error', 'Nama tidak boleh kosong.'); return; }
      if (!blok) { showAddMsg(msg, 'error', 'Blok tidak boleh kosong.'); return; }

      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      api('absen_add_warga', { nama: nama, blok: blok })
        .then(function(res) {
          btn.disabled = false;
          btn.textContent = 'Tambah';

          if (!res.success) {
            showAddMsg(msg, 'error', res.message);
            return;
          }

          showAddMsg(msg, 'success', res.message);
          document.getElementById('addNama').value = '';
          document.getElementById('addBlok').value = '';
          loadData(); // refresh daftar
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'Tambah';
          showAddMsg(msg, 'error', 'Gagal menghubungi server.');
        });
    }

    function showAddMsg(el, type, text) {
      el.style.display = 'block';
      el.textContent = text;
      if (type === 'error') {
        el.style.background = '#fef2f2';
        el.style.color = '#dc2626';
      } else {
        el.style.background = '#f0fdf4';
        el.style.color = '#16a34a';
      }
      setTimeout(function() { el.style.display = 'none'; }, 4000);
    }

    // ── Init ──
    loadData();
  </script>
</body>
</html>
